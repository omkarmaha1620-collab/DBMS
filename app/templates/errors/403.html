{% extends "base.html" %}
{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-lock-fill display-1"></i>
            </div>
            <h2 class="fw-bold">403 - Access Denied</h2>
            <p class="text-muted mt-2">
                You do not have administrative or authorized permissions to view this resource. Role-Based Access Control (RBAC) has intercepted this request.
            </p>
            <div class="mt-4">
                <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house-door me-1"></i> Return to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
