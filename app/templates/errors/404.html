{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow">
            <div class="text-warning mb-3">
                <i class="bi bi-question-circle-fill display-1"></i>
            </div>
            <h2 class="fw-bold">404 - Page Not Found</h2>
            <p class="text-muted mt-2">
                The requested URL or resource was not found on this server.
            </p>
            <div class="mt-4">
                <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house-door me-1"></i> Return to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
