{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4" style="background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%) !important;">
                <i class="bi bi-shield-check display-5"></i>
                <h4 class="fw-bold mt-2 mb-0">Attendance Portal</h4>
                <p class="small text-light opacity-75 mb-0">Apex Institute of Engineering & Technology</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin, turing, student01" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>

                <!-- Quick Fill Demo Credentials (Convenient for Evaluation) -->
                <div class="mt-4 pt-3 border-top">
                    <p class="text-muted small fw-semibold mb-2 text-center text-uppercase">Demo Credentials Quick-Fill</p>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillCredentials('admin', 'Admin@123')">
                            <i class="bi bi-shield-lock me-1"></i> Admin: <strong>admin</strong>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillCredentials('turing', 'Teacher@123')">
                            <i class="bi bi-person-video3 me-1"></i> Teacher: <strong>turing</strong>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillCredentials('student01', 'Student@123')">
                            <i class="bi bi-mortarboard me-1"></i> Student: <strong>student01</strong> (Regular)
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="fillCredentials('student05', 'Student@123')">
                            <i class="bi bi-exclamation-triangle me-1"></i> Student: <strong>student05</strong> (Defaulter &lt;75%)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function fillCredentials(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
